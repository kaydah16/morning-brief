<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
  background: #f7f7f7;
}

.container {
  max-width: 700px;
  margin: auto;
}

.card {
  background: white;
  padding: 24px;
  border-radius: 14px;
}

.brief {
  white-space: pre-wrap;
  font-size: 20px;
  line-height: 1.6;
}

</style>

</head>

<body>

<div class="container">

  <div class="card">

<div class="brief" id="brief">
  Loading Morning Brief...
</div>

  </div>

</div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbz0eA-bU8UirPb-UCAcjFDBWn7M60R_m0u2gjA0v2fI5swHC9kFvnRiNIPCSRIYoV3S/exec";

fetch(scriptURL)
  .then(response => response.text())
  .then(data => {
    document.getElementById("brief").textContent = data;
  })
  .catch(error => {
    document.getElementById("brief").textContent =
      "Unable to load Morning Brief.";
  });

</script>
  
</body>

</html>
